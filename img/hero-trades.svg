<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Skilled tradespeople at work</title>
  <desc id="desc">Stylized illustration of electrician, welder, and carpenter symbols over a construction site silhouette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f00"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ffc107"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Construction silhouette -->
  <g fill="#2a1500">
    <rect x="0" y="300" width="600" height="100"/>
    <path d="M60 300 L140 220 L180 220 L260 300 Z"/>
    <rect x="140" y="234" width="26" height="48" fill="#1c1c1c"/>
    <rect x="180" y="234" width="26" height="48" fill="#1c1c1c"/>
    <path d="M300 300 L360 240 L420 300 Z"/>
    <path d="M430 300 L480 250 L510 250 L560 300 Z"/>
    <rect x="480" y="258" width="16" height="36" fill="#1c1c1c"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#ff6b00" stroke-width="3"/>
  </g>

  <!-- Sun / glow -->
  <circle cx="500" cy="70" r="40" fill="url(#accent)" opacity="0.85"/>

  <!-- Electrician bolt -->
  <circle cx="160" cy="130" r="62" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="2"/>
  <path d="M160 100 L178 128 L166 128 L180 158 L142 128 L153 128 Z" fill="#ff6b00"/>

  <!-- Welder flame -->
  <circle cx="300" cy="130" r="62" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="2"/>
  <path d="M300 100 C282 120 278 135 300 155 C322 135 318 120 300 100 Z" fill="#ffc107"/>
  <path d="M300 118 C291 132 290 140 300 150 C310 140 309 132 300 118 Z" fill="#ff6b00"/>

  <!-- Carpenter tools -->
  <circle cx="440" cy="130" r="62" fill="#1c1c1c" stroke="#2a2a2a" stroke-width="2"/>
  <line x1="416" y1="145" x2="466" y2="115" stroke="#ffc107" stroke-width="10" stroke-linecap="round"/>
  <rect x="410" y="138" width="36" height="12" rx="3" fill="#ff6b00"/>

  <!-- Spark dots -->
  <g fill="#ff6b00">
    <circle cx="330" cy="90" r="3"/>
    <circle cx="300" cy="80" r="2"/>
    <circle cx="345" cy="100" r="2"/>
    <circle cx="360" cy="120" r="2"/>
  </g>
</svg>